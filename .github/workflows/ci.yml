name: CI

on:
  push:
    branches: [main, codex/finalization]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dante
          POSTGRES_PASSWORD: dante
          POSTGRES_DB: dante
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dante -d dante"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DANTE_TEST_DATABASE_URL: postgresql://dante:dante@localhost:5432/dante
      DANTE_REQUIRE_POSTGRES: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Sync deps
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check project_dante tests
      - name: Verification scripts lint
        run: uv run ruff check ../../scripts/verify_e2e.py ../../scripts/verify_real_integration.py
      - name: Typecheck
        run: uv run mypy project_dante --ignore-missing-imports
      - name: Tests
        run: uv run pytest -q
      - name: Evaluation gates
        working-directory: .
        run: uv run --project apps/api python evals/runners/run_all.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Sync API for browser gate
        working-directory: .
        run: uv sync --project apps/api --extra dev
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser journey
        env:
          CI: "1"
          DANTE_DEMO_OPERATOR_TOKEN: ""
          DANTE_STORE_BACKEND: json
          DEMO_MODE: "true"
          RAZORPAY_KEY_ID: ""
          RAZORPAY_KEY_SECRET: ""
        run: npx playwright test
