# ======================================================================
# Project Dante — API service on Railway (Nixpacks builder)
# ----------------------------------------------------------------------
# Deploy: railway up  (or connect the GitHub repo in the dashboard and
# select this file as the service config). One service = the FastAPI app;
# the web tier deploys separately to Vercel (see vercel.json).
#
# FINAL STORAGE POSTURE: the release Railway service uses a managed PostgreSQL
# service. In the API service's Variables tab, set
#   DANTE_STORE_BACKEND=postgres
#   DATABASE_URL=${{Postgres.DATABASE_URL}}
# (the reference is resolved by Railway; do not paste database credentials into
# this repository). The JSON snapshot remains an emergency single-replica
# fallback for local recovery only, not the preferred deployment store.
#
# SINGLE REPLICA IS STILL THE DEMO RELEASE POSTURE (master plan §11.4): keep
# replica count at exactly 1 and scale vertically, not horizontally. Postgres
# supplies durable state; it does not authorize a wider operational rollout.
#
# Required environment variables (set in the Railway dashboard -> Variables):
#   APP_ENV                  — set to "production"
#   RAZORPAY_KEY_ID          — rzp_test_* only (live keys fail closed)  [SECRET]
#   RAZORPAY_KEY_SECRET      — Razorpay test secret                  [SECRET]
#   RAZORPAY_WEBHOOK_SECRET  — must match the dashboard webhook      [SECRET]
#   DEMO_MODE                — "true" for the buildathon demo posture
#   DEMO_OPERATOR_TOKEN      — required when real test keys are set  [SECRET]
#   DANTE_STORE_BACKEND      — "postgres" for the release service
#   DATABASE_URL             — "${{Postgres.DATABASE_URL}}" reference [SECRET]
#   LLM_PROVIDER             — "" | anthropic | openai-compatible
#   LLM_MODEL                — model name when a provider is set
#   LLM_API_KEY              — provider key (omit => rules engine)   [SECRET]
#   PUBLIC_APP_URL           — https://<web-app>.vercel.app (CORS origin)
#   API_BASE_URL             — public https URL of THIS service
#
# Emergency JSON fallback only (do not set for the final Railway service):
#   DANTE_STORE_BACKEND=json and DANTE_STORE_PATH=/data/.dante-store.json,
#   with a Railway volume mounted at /data. The fallback is intentionally
#   documented so recovery remains possible without making it the release
#   default.
# ======================================================================

[build]
builder = "NIXPACKS"
buildCommand = "cd apps/api && python -m pip install --upgrade pip && pip install uv && uv sync --frozen --no-dev"

[deploy]
# $PORT is injected by Railway; uvicorn binds to it explicitly.
startCommand = "cd apps/api && uv run uvicorn project_dante.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/ready"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
